name: build

# compile-only: github runners have no GPU, so this just makes sure every
# kernel still builds on a clean toolchain. correctness/perf numbers are all
# from my local card (see README).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: nvidia/cuda:13.3.1-devel-ubuntu24.04
    steps:
      - run: apt-get update && apt-get install -y git ca-certificates
      - uses: actions/checkout@v4
      - name: build everything
        run: make ARCH=sm_86 -j$(nproc)
      - name: build for a couple more archs
        run: |
          make clean
          make ARCH=sm_89 -j$(nproc)
